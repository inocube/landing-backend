AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: inocube backend - Phase 0 skeleton

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.14
    Architectures: [arm64] # Graviton - lacnejsi a rychlejsi
    Tracing: Active # X-Ray tracing hned od zaciatku

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/health/
      Handler: app.lambda_handler
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get

Outputs:
  ApiUrl:
    Description: "Base URL API Gateway"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
