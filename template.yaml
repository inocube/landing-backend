AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: inocube backend - Phase 0 skeleton

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.14
    Architectures: [arm64] # Graviton - lacnejsi a rychlejsi
    Tracing: Active # X-Ray tracing hned od zaciatku

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/health/
      Handler: app.lambda_handler
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
  LeadsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/leads/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref LeadsTable
          # Empty in AWS. Declared so `sam local start-api --env-vars` can point it at DynamoDB Local.
          DYNAMODB_ENDPOINT: ""
      Policies:
        # Least privilege: PutItem/UpdateItem/BatchWriteItem on this table only, no reads.
        - DynamoDBWritePolicy:
            TableName: !Ref LeadsTable
      Events:
        CreateLead:
          Type: Api
          Properties:
            Path: /leads
            Method: post
  LeadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: inocube-leads
      BillingMode: PAY_PER_REQUEST # on-demand: platíš za requesty, nie za rezervovanú kapacitu
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  ApiUrl:
    Description: "Base URL API Gateway"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  LeadsTableName:
    Description: "Názov DynamoDB tabuľky pre leady"
    Value: !Ref LeadsTable
